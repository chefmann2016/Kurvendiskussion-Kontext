{title:"Rückhaltebecken",level:"Geführter Einstieg", context:"Nach einem Regen wird die Wasserhöhe über dem Beckenboden modelliert. x ist die Zeit in Stunden seit Messbeginn, f(x) die Wasserhöhe in Dezimetern.", formula:"f(x) = 2 + x² − 0,1x³", range:[0,6], axis:"x (h)", coefficients:[2,0,1,-.1], graph:true, parts:[
part("Wasserhöhe nach zwei Stunden","Berechne f(2) und interpretiere das Ergebnis in einem Satz.",[num("Wasserhöhe in dm",5.2),open("Antwortsatz")],F,["Was gibt x = 2 an? In welcher Einheit wird die Wasserhöhe gemessen?","Welche Modellgröße liefert direkt die Wasserhöhe?","Setze 2 in beide Potenzen ein. Beachte die Reihenfolge beim Rechnen.","Ergänze deinen Satz um Zeitpunkt, Höhe und Bezug zum Beckenboden."],"f(2) = 2 + 4 − 0,8 = 5,2. Zwei Stunden nach Messbeginn steht das Wasser 5,2 dm über dem Beckenboden.",["Zeitpunkt seit Messbeginn","Höhe in dm über dem Boden"]),
part("Entwicklung der Wasserhöhe","Lies am Graphen das Verhalten ab. Begründe anschließend mit der Ableitung, wie sich die Wasserhöhe im gesamten Messzeitraum verändert.",[pick("Verhalten im Modellintervall","streng steigend","zuerst steigend, dann fallend","streng fallend"),open("Begründung")],D,["Geht es um die Wasserhöhe in dm oder um ihre Änderung in dm/h?","Welche Ableitung hilft dir, steigende Abschnitte zu erkennen?","Klammere in der ersten Ableitung x aus und prüfe die Vorzeichen beider Faktoren.","Beschreibe die Entwicklung für 0 bis 6 Stunden."],"f′(x) = x(2 − 0,3x). Für 0 < x ≤ 6 sind beide Faktoren positiv. Die Wasserhöhe steigt im gesamten Modellintervall streng, auch wenn f′(0) = 0.",["Vorzeichen der ersten Ableitung","Aussage zum ganzen Modellintervall"]),
part("Am schnellsten steigend","Berechne, wann die Wasserhöhe am schnellsten steigt. Gib auch die momentane Änderungsrate an. Überprüfe dann die Aussage: „Zu diesem Zeitpunkt ist die Wasserhöhe am größten.“",[num("Zeit in h (auf Hundertstel)",10/3,.00501),num("Rate in dm/h (auf Hundertstel)",10/3,.00501),pick("Aussage","falsch","richtig"),open("Begründung")],D,["Vergleiche die Einheiten von Wasserhöhe und momentaner Änderungsrate. Welche Größe soll zuerst möglichst groß sein?","Maximiere die Änderungsrate. Welche Ableitung dieser Änderungsrate muss an einem inneren Maximum null sein?","f′(x) = 0 bedeutet eine waagrechte Tangente an f. Für das Maximum von f′ untersuchst du f″(x) = 0 und prüfst, ob f′ danach fällt.","Vergleiche den Zeitpunkt der größten Steigung mit dem Zeitpunkt der größten Höhe."],"f″(x) = 2 − 0,6x wird bei x = 10/3 null und wechselt von positiv zu negativ. Daher steigt die Höhe nach rund 3,33 h am schnellsten (rund 3,33 dm/h). Die größte Höhe liegt wegen der durchgehenden Zunahme erst bei x = 6.",["Maximum von f′ mit Vorzeichenwechsel von f″","Höhe erst am rechten Rand am größten"],{fallback:"Für die Überprüfung der Aussage kannst du mit x ≈ 3,33 h als Zeitpunkt der größten Steigung weiterarbeiten.",marker:[10/3,1]})
]},
{title:"Höhenprofil eines Radwegs",level:"Grundlagen anwenden",context:"Ein vereinfachtes Höhenprofil gibt die Höhe relativ zu einer Bezugslinie an. x ist die horizontale Entfernung vom Nullpunkt der Messskala in Einheiten von 100 m. f(x) ist die relative Höhe in Metern.",formula:"f(x) = (x − 1)(x − 3)(x − 5)",range:[1,5],axis:"x (je 100 m)",coefficients:[-15,23,-9,1],graph:true,parts:[

part("Zwischen zwei Markierungen","Berechne die relative Höhe bei x = 2 und interpretiere das Vorzeichen.",[num("Relative Höhe in m",3),open("Antwortsatz")],F,["Ist die Entfernung gegeben oder gesucht? In welcher Einheit soll die relative Höhe angegeben werden?","Welche Funktion liefert die relative Höhe bei x = 2?","Berechne die drei Faktoren einzeln und achte auf die Anzahl negativer Faktoren.","Was bedeutet das Vorzeichen in Bezug auf die Bezugslinie?"],"f(2) = 1 · (−1) · (−3) = 3. Der Weg liegt bei 200 m um 3 m über der Bezugslinie.",["200 m als Abstand","3 m über der Bezugslinie"]),
part("Kurvenform bei der mittleren Markierung","Bestimme bei der mittleren Nullstelle, ob ein Wendepunkt vorliegt. Begründe anhand der Krümmung auf beiden Seiten.",[pick("Ein Wendepunkt liegt vor","ja","nein"),open("Begründung")],DD,["Welche Eigenschaft des Höhenprofils untersuchst du an der Markierung?","Welche Ableitung zeigt die Krümmung an?","Eine Nullstelle der zweiten Ableitung ist ein Kandidat. Prüfe die Vorzeichen links und rechts.","Benenne den Krümmungswechsel und gib die Entfernung in Metern an."],"Ausmultipliziert ist f(x) = x³ − 9x² + 23x − 15. f″(x) = 6x − 18 ist links von 3 negativ und rechts positiv. Das Profil ist zunächst rechts-, dann linksgekrümmt. Bei 300 m liegt ein Wendepunkt.",["Vorzeichenwechsel von f″","300 m und Richtung des Krümmungswechsels"],{fallback:"Verwende x = 3 als mittlere Nullstelle.",marker:[3,0]})
]},
{title:"Temperatur im Gewächshaus",level:"Lokale und globale Extrema",context:"Während eines vierstündigen Lüftungsversuchs beschreibt f(x) die Temperatur in °C. x ist die Zeit in Stunden seit Beginn.",formula:"f(x) = 20 + x³ − 6x² + 9x",range:[0,4],axis:"x (h)",coefficients:[20,9,-6,1],parts:[
part("Hoch oder tief?","Berechne die beiden inneren Stellen mit waagrechter Tangente. Begründe, welche davon eine lokale Hochstelle ist.",[num("Kleinere Zeit in h",1),num("Größere Zeit in h",3),open("Begründung")],D,["Gesucht sind Zeitpunkte. In welcher Einheit gibst du sie an?","Was gilt für die Steigung einer waagrechten Tangente?","Teile f′(x) = 0 durch 3. Prüfe anschließend die Vorzeichen von f′ in den drei Teilintervallen.","Beschreibe, wann die Temperatur von Steigen zu Sinken übergeht."],"f′(x) = 3(x − 1)(x − 3). Das Vorzeichenmuster ist +, −, +. Bei 1 h liegt ein lokales Maximum, bei 3 h ein lokales Minimum.",["Beide stationären Stellen","Vorzeichenwechsel von + nach − bei 1 h"]),

part("Ein Einwand zur Lüftung","Überprüfe die Behauptung: „Nach dem lokalen Maximum bleibt die Temperatur bis zum Versuchsende unter 24 °C.“",[pick("Behauptung","falsch","richtig"),open("Begründung mit Gegenbeispiel oder Beweis")],F,["Untersuche die Temperatur nach dem lokalen Maximum. Welche Einheit hat der Grenzwert?","Wie kannst du prüfen, ob 24 °C noch einmal erreicht werden?","Prüfe den letzten im Modell enthaltenen Zeitpunkt.","Erkläre, wie sich ‚unter 24 °C‘ und ‚genau 24 °C‘ unterscheiden."],"Nach vier Stunden werden wieder genau 24 °C erreicht. Der Endzeitpunkt ist im Modellintervall enthalten und widerlegt die Behauptung.",["Zeitpunkt x = 4","24 °C am Versuchsende"],{fallback:"Das lokale Maximum liegt bei x = 1."})
]},
{title:"Zulauf zum Speicher",level:"Sattelstelle erkennen",context:"Ein Tank füllt sich über vier Minuten. x ist die Zeit in Minuten seit Beginn. f(x) gibt die Wassermenge im Tank in Litern an.",formula:"f(x) = 100 + 2(x − 2)³",range:[0,4],axis:"x (min)",coefficients:[84,24,-12,2],graph:true,parts:[
part("Wasser im Tank","Berechne den Inhalt zu Beginn und am Ende. Bestimme, um wie viele Liter die Wassermenge insgesamt zunimmt.",[num("Beginn in L",84),num("Ende in L",116),num("Zunahme in L",32)],F,["Welche Zeitpunkte gehören zu Beginn und Ende? In welcher Einheit misst man die Wassermenge?","Welche Modellgröße liefert die Inhalte? Wie bildest du daraus die absolute Änderung?","Bei x = 0 bleibt die dritte Potenz von −2 negativ.","Beschreibe die Differenz als Veränderung in Litern über vier Minuten."],"f(0) = 84 L, f(4) = 116 L. Die Wassermenge nimmt um 116 − 84 = 32 L zu."),
part("Moment ohne Zulauf","Berechne, wann der momentane Zulauf null ist, und bestimme die Wassermenge zu diesem Zeitpunkt.",[num("Zeit in min",2),num("Wassermenge in L",100)],D,["Unterscheide Wassermenge in L von Zulauf in L/min. Was soll null sein?","Welche Modellgröße entspricht dem momentanen Zulauf?","Leite den Kubikterm ab und überprüfe, wann der verbleibende quadratische Term null wird.","Setze den Zeitpunkt in f ein, um die Wassermenge in Litern zu bestimmen."],"f′(x) = 6(x − 2)², also f′(2) = 0 L/min. Im Tank befinden sich nach 2 min genau f(2) = 100 L.",[],{marker:[2,1]}),
part("Extrempunkt oder Sattelpunkt?","Klassifiziere den Punkt aus Teil b. Begründe mit Tangente und Krümmung. Überprüfe dabei die Aussage: „Der Tank hört ab diesem Zeitpunkt auf, sich zu füllen.“",[pick("Punkttyp","Sattelpunkt","lokaler Hochpunkt","lokaler Tiefpunkt"),open("Begründung und Deutung")],DD,["Welche Eigenschaften von Wassermenge und Zulauf musst du an der Stelle unterscheiden?","Welche Ableitungen zeigen die waagrechte Tangente und einen Krümmungswechsel?","Für einen Sattelpunkt prüfst du f′(2) und das Vorzeichen von f″ links und rechts. Prüfe auch f′ unmittelbar nach 2 min.","Formuliere, was im einzelnen Moment passiert und was danach passiert."],"f′(2) = 0 und f″(x) = 12(x − 2) wechselt von negativ zu positiv. (2 | 100) ist ein Sattelpunkt. f′ ist auf beiden Seiten positiv, daher steigt die Wassermenge weiter. Der Zulauf ist nur im einzelnen Moment bei x = 2 null.",["Waagrechte Tangente","Krümmungswechsel","Weiterer Anstieg nach 2 min"],{fallback:"Untersuche den Punkt (2 | 100).",marker:[2,0]})
]},
{title:"Bewässerungsversuch",level:"Zwei Kennwerte vergleichen",context:"In einem Versuch werden pro Pflanze insgesamt x Liter zusätzliches Bewässerungswasser eingesetzt. f(x) modelliert die Erntemasse pro Pflanze in Gramm.",formula:"f(x) = 120 + 36x² − 8x³",range:[0,4],axis:"x (L je Pflanze)",coefficients:[120,0,36,-8],graph:true,parts:[
part("Größter Ertrag","Bestimme die Wassermenge für den größten Ertrag und berechne diesen Ertrag. Begründe, weshalb es das globale Maximum ist.",[num("Wassermenge in L je Pflanze",3),num("Ertrag in g je Pflanze",228),open("Begründung")],D,["Welche Größe soll am größten werden? In welcher Einheit wird sie gemessen?","Welche Gleichung liefert Kandidaten im Inneren des Intervalls?","Faktorisiere f′ und prüfe, wo der Ertrag zunimmt bzw. abnimmt.","Gib die optimale Wassermenge und die zugehörige Erntemasse getrennt an."],"f′(x) = 24x(3 − x). Der Ertrag steigt bis x = 3 und fällt danach. Das globale Maximum beträgt f(3) = 228 g pro Pflanze bei 3 L.",["Vorzeichenwechsel von f′","Ertrag und Wassermenge samt Einheiten"],{marker:[3,0]}),
part("Größter marginaler Ertragszuwachs","Bestimme die Wassermenge, bei der der Ertrag pro zusätzlichem Liter momentan am stärksten zunimmt. Berechne auch diese Rate.",[num("Wassermenge in L je Pflanze",1.5),num("Rate in g/L",54)],D,["Welche Einheit hat die momentane Änderung der Erntemasse bezogen auf Wasser?","Maximiere die momentane Rate. Welche Gleichung liefert einen inneren Kandidaten?","f′(x) = 0 bedeutet Nullzuwachs. Für die größte Rate suchst du ein Maximum von f′. Prüfe dazu den Vorzeichenwechsel von f″.","Setze die gefundene Wassermenge in f′ ein und gib die Rate in g/L an."],"f″(x) = 72 − 48x wechselt bei x = 1,5 von + zu −. Die höchste Rate liegt daher bei 1,5 L je Pflanze und beträgt f′(1,5) = 54 g/L.",[],{marker:[1.5,1]}),
part("Zwei Empfehlungen vergleichen","Überprüfe die Behauptung: „Die Wassermenge für den größten Ertrag ist dieselbe wie für den größten marginalen Zuwachs.“ Erkläre den Unterschied im Sachzusammenhang.",[pick("Behauptung","falsch","richtig"),open("Vergleich in eigenen Worten")],D,["Vergleichst du eine Masse in g oder eine Rate in g/L? Benenne beide Ziele.","Ordne jedem Ziel f oder f′ zu.","Vergleiche die x-Koordinaten der beiden Maxima.","Erkläre, was bei jeder der beiden Wassermengen optimiert wird."],"Bei 1,5 L ist der momentane Ertragszuwachs pro zusätzlichem Liter am größten, bei 3 L ist die Erntemasse am größten. Bei 3 L ist der marginale Zuwachs null.",["Beide Wassermengen","Unterschied zwischen Ertrag und Rate"],{fallback:"Verwende 3 L für den größten Ertrag und 1,5 L für den größten marginalen Zuwachs."})
]},
{title:"Lärmmessung entlang eines Weges",level:"Maturaniveau",context:"Ein Modell beschreibt den Schallpegel entlang eines 600 m langen Weges. x ist die Entfernung vom westlichen Ende in Einheiten von 100 m, f(x) der modellierte Schallpegel in dB. Die Wegmitte liegt bei x = 3.",formula:"f(x) = 30 + ((x − 3)² − 4)²",range:[0,6],axis:"x (je 100 m)",coefficients:[55,-60,46,-12,1],graph:true,parts:[
part("Ruhebereiche und ein lokaler Hochpunkt","Berechne alle inneren Stellen mit waagrechter Tangente und klassifiziere sie. Gib die Entfernungen vom westlichen Ende in Metern an.",[num("Kleinste Entfernung in m",100),num("Mittlere Entfernung in m",300),num("Größte Entfernung in m",500),open("Klassifikation und Begründung")],D,["Gesucht sind Orte. Wie rechnest du von x auf Meter um?","Welche Gleichung beschreibt eine waagrechte Tangente?","Leite mit der Kettenregel ab und nutze die Produktform für die Nullstellen. Prüfe danach die Vorzeichen.","Gib für jeden Ort an, ob der Pegel dort ein lokales Maximum oder Minimum hat."],"f′(x) = 4(x − 3)((x − 3)² − 4) = 4(x − 3)(x − 1)(x − 5). Das Vorzeichenmuster lautet −, +, −, +. Bei 100 m und 500 m liegen lokale Tiefpunkte (30 dB), bei 300 m ein lokaler Hochpunkt (46 dB).",["Vorzeichenwechsel oder zweite Ableitung","Tiefpunkte bei 100 m und 500 m, Hochpunkt bei 300 m"],{markers:[[1,0],[3,0],[5,0]]}),
part("Der lauteste Abschnitt","Überprüfe die Aussage: „In der Wegmitte ist der Schallpegel am größten.“ Ermittle den höchsten Pegel und alle Orte, an denen er erreicht wird.",[pick("Aussage","falsch","richtig"),num("Höchster Pegel in dB",55),open("Orte und Begründung")],F,["Welche Größe soll am größten sein? In welcher Einheit wird sie angegeben?","Welche Funktion liefert die Pegel für alle inneren Kandidaten und Randpunkte?","Nutze die Symmetrie: Vergleiche den Pegel an einem Rand mit dem Pegel in der Mitte und an den inneren Tiefpunkten.","Nenne alle Orte, an denen der höchste Pegel auftritt, in Metern."],"f(0) = f(6) = 55 dB, f(1) = f(5) = 30 dB, f(3) = 46 dB. Der höchste Pegel liegt an beiden Wegenden (0 und 600 m). Die Aussage ist falsch.",["Randwerte und innere Werte verglichen","0 m und 600 m genannt"],{fallback:"Innere Kandidaten sind x = 1, 3 und 5.",markers:[[0,0],[6,0]]}),
part("Wechsel der Krümmung","Berechne die Entfernungen der Wendestellen vom westlichen Ende. Runde auf ganze Meter. Interpretiere den ersten Krümmungswechsel mithilfe der Steigung des Pegelprofils.",[num("Erste Entfernung in m",185,.5),num("Zweite Entfernung in m",415,.5),open("Deutung der ersten Wendestelle")],DD,["Gesucht sind zwei Entfernungen. Welche Größe beschreibt, wie sich die Steigung verändert?","Welche Gleichung liefert Kandidaten für einen Wechsel der Krümmung?","Schreibe f″ als Term in (x − 3)². Prüfe das Vorzeichen außen und zwischen den Lösungen.","Was passiert mit f′ beim ersten Wechsel von f″ > 0 zu f″ < 0?"],"f″(x) = 12(x − 3)² − 16. Die Nullstellen liegen bei x = 3 ± √(4/3), also bei rund 185 m und 415 m. Das Vorzeichenmuster ist +, −, +. An der ersten Wendestelle hat f′ ein lokales Maximum: Im Anstieg zwischen 100 m und 300 m nimmt der Pegel dort pro zusätzlichem Meter am stärksten zu.",["Vorzeichenwechsel von f″","Lokales Maximum von f′ und Bedeutung für den Pegel"],{markers:[[3-Math.sqrt(4/3),0],[3+Math.sqrt(4/3),0]]})
]},
{title:"Selbstcheck · Solarleistung",level:"Selbstcheck",context:"Während eines kurzen Messfensters wird die elektrische Leistung einer Solaranlage modelliert. x ist die Zeit in Stunden seit Beginn des Messfensters, f(x) die Leistung in kW. Gesucht ist, wann die Leistung am schnellsten zunimmt.",formula:"f(x) = 8 + 3x² − x³",range:[0,3],axis:"x (h)",coefficients:[8,0,3,-1],parts:[

];

const conditions=[
 ["Wert einsetzen","Vorzeichen prüfen","Maximum einer Rate"],
 ["Nullstellen bestimmen","Wert einsetzen","Krümmungswechsel prüfen"],
 ["Stationäre Stellen bestimmen","Funktionswerte vergleichen","Funktionswerte vergleichen"],
 ["Funktionswerte vergleichen","Stationäre Stellen bestimmen","Waagrechte Tangente und Krümmungswechsel prüfen"],
 ["Stationäre Stellen bestimmen","Maximum einer Rate","Maxima von f und f′ vergleichen"],
 ["Stationäre Stellen bestimmen","Funktionswerte vergleichen","Krümmungswechsel prüfen"]
];
const descriptions={
 "Wert einsetzen":"Gegebenes x in f einsetzen",
 "Vorzeichen prüfen":"Vorzeichen von f′ im Intervall prüfen",
 "Maximum einer Rate":"f″ = 0 lösen und Maximum von f′ prüfen",
 "Nullstellen bestimmen":"f = 0 lösen",
 "Krümmungswechsel prüfen":"f″ = 0 und Vorzeichenwechsel von f″ prüfen",
 "Stationäre Stellen bestimmen":"f′ = 0 lösen",
 "Funktionswerte vergleichen":"Passende Funktionswerte berechnen und vergleichen",
 "Waagrechte Tangente und Krümmungswechsel prüfen":"f′ = 0 und Vorzeichenwechsel von f″ prüfen",
 "Maxima von f und f′ vergleichen":"Stellen der beiden Maxima vergleichen"
};
const stages=["Text verstehen","Mathematisch übersetzen","Ansatz prüfen","Ergebnis deuten"];
const state=cases.map(entry=>({
  curves:[true,false,false], submitted:false,
  parts:entry.parts.map(p=>({values:p.fields.map(()=>""),step:-1,notes:["","","",""],function:"",condition:"",solution:false,hint:""}))
}));
const work=document.querySelector("#work");
const nav=document.querySelector("nav");
let current=0;
const $=(tag,txt,cls)=>{
  const e=document.createElement(tag);
  if(txt!==undefined)e.textContent=txt;
  if(cls)e.className=cls;
  return e;
};
function selector(options,value){
  const el=$("select");
  options.forEach(s=>{const opt=$("option",s||"Bitte wählen");opt.value=s;el.append(opt)});
  el.value=value;return el;
}
function label(text,control){
  const el=$("label");el.append($("span",text),control);return el;
}
function action(text,fn,cls){
  const el=$("button",text,cls);el.type="button";el.addEventListener("click",fn);return el;
}
function number(text){
  const cleaned=text.trim().replace(/−/g,"-").replace(",",".");
  return /^[+-]?(?:\d+(?:\.\d*)?|\.\d+)$/.test(cleaned)?Number(cleaned):NaN;
}
function correct(field,value){
  return field.options?value===field.value:Math.abs(number(value)-field.value)<=field.tol+1e-10;
}
function solved(part,data){
  const checked=part.fields.filter(f=>!f.open);
  return checked.length>0&&part.fields.every((f,i)=>f.open?data.values[i].trim().length>0:correct(f,data.values[i]));
}
function shuffle(options,seed){
  return options.map((value,index)=>({value,key:((index+1)*37+seed*29)% (options.length*19+7)}))
    .sort((a,b)=>a.key-b.key).map(item=>item.value);
}
function deriv(poly){return poly.slice(1).map((v,i)=>v*(i+1))}
function evaluate(poly,x){return poly.reduceRight((sum,v)=>sum*x+v,0)}
function draw(plot,entry,data){
  const [a,b]=entry.range;
  const polys=[entry.coefficients,deriv(entry.coefficients),deriv(deriv(entry.coefficients))];
  const samples=polys.map(poly=>Array.from({length:161},(_,i)=>evaluate(poly,a+(b-a)*i/160)));
  const values=samples.flatMap((s,i)=>data.curves[i]?s:[]);
  const lo=Math.min(0,...values),hi=Math.max(1,...values);
  const step=([1,2,5,10].map(n=>n*10**Math.floor(Math.log10((hi-lo)/5))).find(n=>n>=(hi-lo)/5))||1;
  const bottom=Math.floor(lo/step)*step,top=Math.ceil(hi/step)*step;
  const sx=x=>57+555*(x-a)/(b-a),sy=y=>270-233*(y-bottom)/(top-bottom);
  const colors=["#07584e","#a63b27","#5937a1"];
  const fmt=n=>new Intl.NumberFormat("de-AT",{maximumFractionDigits:2}).format(n);
  const lines=[];
  for(let y=bottom;y<=top+step/100;y+=step){
    lines.push(`<path d="M57 ${sy(y)}H612" stroke="${Math.abs(y)<step/100?"#667e79":"#d2e0dc"}"/><text x="50" y="${sy(y)+4}" text-anchor="end">${fmt(y)}</text>`);
  }
  const ticks=b-a;
  for(let i=0;i<=ticks;i++){
    const x=a+i;
    lines.push(`<path d="M${sx(x)} 37V270" stroke="#d2e0dc"/><text x="${sx(x)}" y="290" text-anchor="middle">${fmt(x)}</text>`);
  }
  samples.forEach((s,i)=>{
    if(!data.curves[i])return;
    const path=s.map((y,j)=>`${j?"L":"M"}${(57+555*j/160).toFixed(2)} ${sy(y).toFixed(2)}`).join("");
    lines.push(`<path d="${path}" fill="none" stroke="${colors[i]}" stroke-width="3" stroke-dasharray="${["none","10 4","3 4"][i]}"/>`);
  });
  entry.parts.forEach((p,j)=>{
    if(!data.parts[j].solution&&!solved(p,data.parts[j]))return;
    for(const [x,i] of p.markers||(p.marker?[p.marker]:[])){
      if(!data.curves[i])continue;
      const y=evaluate(polys[i],x), px=sx(x),py=sy(y);
      lines.push(`<circle cx="${px}" cy="${py}" r="5" fill="${colors[i]}" stroke="white" stroke-width="2"/><text x="${Math.min(584,Math.max(85,px))}" y="${py<58?py+18:py-10}" text-anchor="middle" stroke="#f6faf8" stroke-width="4" paint-order="stroke">x ≈ ${fmt(x)}</text>`);
    }
  });
  plot.innerHTML=`<svg viewBox="0 0 640 327" role="img" aria-label="Graphen im Modellintervall" font-size="15" fill="#244440"><text x="57" y="23">Zahlenwerte der ausgewählten Funktionen</text>${lines.join("")}<text x="612" y="314" text-anchor="end">${entry.axis}</text></svg>`;
}
function graph(entry,data){
  const box=$("figure"),bar=$("div",undefined,"toggles"),plot=$("div");
  [F,D,DD].forEach((name,i)=>{
    const check=$("input");check.type="checkbox";check.checked=data.curves[i];
    const item=$("label");item.append(check," "+name+" · "+["durchgezogen","gestrichelt","gepunktet"][i]);bar.append(item);
    check.onchange=()=>{data.curves[i]=check.checked;draw(plot,entry,data)};
  });
  box.append(bar,plot,$("figcaption","Gemeinsame Zahlenskala für die sichtbaren Kurven. Die Einheiten von Funktion und Ableitungen ergeben sich aus dem Modell.","caption"));
  draw(plot,entry,data);
  return {box,refresh:()=>draw(plot,entry,data)};
}
function renderTutor(p,data,idx){
  const panel=$("div",undefined,"tutor");
  panel.hidden=data.step<0;
  const build=()=>{
    panel.replaceChildren();panel.hidden=data.step<0;
    if(panel.hidden)return;
    const step=data.step;
    const title=$("strong",`Schritt ${step+1} von 4 · ${stages[step]}`);
    title.tabIndex=-1;
    panel.append(title);
    const key=conditions[current][idx];
    if(step===2){
      const together=key==="Waagrechte Tangente und Krümmungswechsel prüfen"||key==="Maxima von f und f′ vergleichen";
      const acceptable=together?[F,D,DD].filter(f=>key.startsWith("Waagrechte")?f!==F:f!==DD):[p.approach];
      let response="Vergleiche deinen gewählten Ansatz mit der gesuchten Größe.";
      if(key==="Maximum einer Rate"&&(data.condition==="Stationäre Stellen bestimmen"||/f[′´'’]\s*\(.*?\)\s*=\s*0|f[′´'’]\s*=\s*0/.test(data.notes[1]))){
        response="Dein Ansatz f′ = 0 sucht eine Stelle mit Steigung null. Hier soll die Steigung selbst möglichst groß werden. Betrachte f′ als die zu maximierende Funktion.";
      }else if(acceptable.includes(data.function)&&data.condition===key){
        response="Deine Auswahl passt zur Sachfrage. Prüfe jetzt die Rechnung mit diesem Ansatz.";
      }else if(!acceptable.includes(data.function)){
        response=`Du hast ${data.function} gewählt. Überlege, welche Größe deine Wahl beschreibt und ob sie zur Sachfrage passt.`;
      }else{
        response="Die gewählte Funktion passt. Überprüfe, ob die gewählte Bedingung tatsächlich die gesuchte Eigenschaft beschreibt.";
      }
      panel.append($("p",response));
    }
    panel.append($("p",p.hints[step]));
    const notes=$("textarea");notes.rows=2;notes.value=data.notes[step];
    if(step===1){
      const f=selector(["",F,D,DD],data.function);
      f.onchange=()=>{data.function=f.value;update()};
      const cond=$("select");cond.append(new Option("Bitte wählen",""));
      Object.entries(descriptions).forEach(([k,v])=>cond.append(new Option(v,k)));
      cond.value=data.condition;
      cond.onchange=()=>{data.condition=cond.value;update()};
      const choices=$("div",undefined,"grid");
      choices.append(label("Welche Funktion steht im Mittelpunkt?",f),label("Welche Bedingung passt?",cond));panel.append(choices);
    }
    panel.append(label(step===0?"Gesuchte Größe und Einheit":step===3?"Deutung in einem Satz":"Dein Ansatz in eigenen Worten",notes));
    const btn=action(step===3?"Tutorantwort übernehmen":"Ansatz übernehmen und nächsten Hinweis öffnen",()=>{
      if(step<3){data.step++;build();panel.querySelector("strong").focus()}
      else {
        data.hint="Deutung übernommen. Du kannst deine Antwort oben überprüfen und bei Bedarf die Musterlösung öffnen.";
        info.textContent=data.hint;
      }
    });
    const info=$("output",data.hint,"feedback good");info.setAttribute("aria-live","polite");
    function update(){
      data.notes[step]=notes.value;
      btn.disabled=!notes.value.trim()||(step===1&&(!data.function||!data.condition));
    }
    notes.addEventListener("input",update);
    update();
    const tools=$("div",undefined,"tools");
    if(step>0)tools.append(action("Vorheriger Schritt",()=>{data.step--;build();panel.querySelector("strong").focus()}));
    tools.append(btn);panel.append(tools,info);
  };
  build();
  return {panel,build};
}
function solution(p){
  const box=$("div",undefined,"solution");
  box.append($("p",p.solution));
  if(p.criteria.length){
    box.append($("strong","Checkliste für deinen Antwortsatz"));
    p.criteria.forEach(text=>{
      const item=$("label");item.style.display="block";
      const check=$("input");check.type="checkbox";item.append(check," "+text);box.append(item);
    });
  }
  return box;
}
function renderPart(p,idx,entry,data,self,refresh){
  const card=$("article"), item=data.parts[idx];
  card.append($("h3",`${self?"":String.fromCharCode(97+idx)+") "}${p.title}`),$("p",p.task));
  const grid=$("div",undefined,"grid");
  p.fields.forEach((field,i)=>{
    const input=field.options?selector(["",...shuffle(field.options,current+idx+i+1)],item.values[i]):$(field.open?"textarea":"input");
    if(!field.options){ input.value=item.values[i]; if(field.open)input.rows=3;else input.inputMode="decimal" }
    input.disabled=self&&data.submitted;
    const wrap=label(field.label,input);
    if(field.open)wrap.style.gridColumn="1 / -1";
    const msg=$("output",undefined,"feedback");msg.id=`feedback-${idx}-${i}`;msg.setAttribute("aria-live","polite");
    input.setAttribute("aria-describedby",msg.id);
    const feedback=()=>{
      if(field.open){
        msg.textContent=self?(data.submitted?"Vergleiche deinen Satz mit Musterlösung und Checkliste.":""):"Offene Antwort · Vergleiche deinen Satz anschließend mit der Checkliste.";
        return;
      }
      if(self&&!data.submitted)return;
      const value=item.values[i].trim(),ok=correct(field,value);
      msg.classList.toggle("good",ok);
      msg.textContent=!value?(data.submitted?"Keine Antwort":""):ok?"Richtig":(!field.options&&!Number.isFinite(number(value))?"Gib einen Zahlenwert ein.":"Überprüfe deine Antwort.");
    };
    input.addEventListener(field.options?"change":"input",()=>{
      item.values[i]=input.value;feedback();refresh();
    });
    wrap.append(msg);grid.append(wrap);feedback();
  });
  card.append(grid);
  if(p.fallback){
    if(p.help){
      const disclosure=$("details");
      disclosure.append($("summary","Ersatzhilfe anzeigen"),$("p",p.help));
      card.append(disclosure);
    }else{
      const disclosure=$("details");disclosure.append($("summary","Ersatzwert anzeigen"),$("p",p.fallback));card.append(disclosure);
    }
  }
  if(self){if(data.submitted)card.append(solution(p));return card}
  const tutor=renderTutor(p,item,idx);
  const model=solution(p);model.hidden=!item.solution;model.id=`solution-${idx}`;
  const buttons=$("div",undefined,"tools");
  const tutorBtn=action(item.step<0?"Tutor starten":"Tutor anzeigen",()=>{
    if(item.step<0){item.step=0;tutor.build()}
    else tutor.panel.hidden=!tutor.panel.hidden;
    tutorBtn.textContent=tutor.panel.hidden?"Tutor anzeigen":"Tutor schließen";
    tutorBtn.setAttribute("aria-expanded",String(!tutor.panel.hidden));
    if(!tutor.panel.hidden)tutor.panel.querySelector("strong").focus();
  });
  tutor.panel.id=`tutor-${idx}`;
  tutor.panel.hidden=true;
  tutorBtn.setAttribute("aria-controls",tutor.panel.id);tutorBtn.setAttribute("aria-expanded","false");
  const show=action(item.solution?"Musterlösung schließen":"Musterlösung öffnen",()=>{
    item.solution=!item.solution;model.hidden=!item.solution;
    show.textContent=item.solution?"Musterlösung schließen":"Musterlösung öffnen";
    show.setAttribute("aria-expanded",String(item.solution));refresh();
  });
  show.setAttribute("aria-controls",model.id);show.setAttribute("aria-expanded",String(item.solution));
  buttons.append(tutorBtn,show);card.append(buttons,tutor.panel,model);
  return card;
}
function render(focus=false){
  const entry=cases[current], data=state[current],self=current===cases.length-1;
  nav.querySelectorAll("button").forEach((b,i)=>{if(i===current)b.setAttribute("aria-current","step");else b.removeAttribute("aria-current")});
  work.replaceChildren();
  const head=$("div",undefined,"panel"),heading=$("h2",entry.title);heading.tabIndex=-1;
  head.append($("div",entry.level,"tag"),heading,$("p",entry.context),$("div",`${entry.formula}    ·    Modellintervall [${entry.range.join("; ")}]`,"model"));
  if(self)head.append($("p","Bearbeite die drei Schritte und gib den Selbstcheck ab. Danach siehst du dein Ergebnis je Schritt und die Musterlösungen."));
  const figure=entry.graph?graph(entry,data):null;
  if(figure)head.append(figure.box);
  work.append(head);
  if(self&&data.submitted){
    const result=$("div",undefined,"panel");result.tabIndex=-1;result.id="result";
    result.append($("h3","Deine Auswertung"));
    const list=$("ul");
    entry.parts.forEach((p,j)=>{
      const count=p.fields.filter(f=>!f.open).length;
      const score=p.fields.filter((f,i)=>!f.open&&correct(f,data.parts[j].values[i])).length;
      list.append($("li",`${p.title} · ${score} von ${count} überprüfbaren Eingaben richtig${p.criteria.length?". Begründung mit der Checkliste prüfen.":"."}`));
    });
    result.append(list);work.append(result);
  }
  entry.parts.forEach((p,i)=>work.append(renderPart(p,i,entry,data,self,figure?.refresh||(()=>{}))));
  const footer=$("div",undefined,"tools");
  if(current>0)footer.append(action("Vorherige Aufgabe",()=>go(current-1)));
  if(!self)footer.append(action("Nächste Aufgabe",()=>go(current+1),"primary"));
  else if(!data.submitted)footer.append(action("Selbstcheck abgeben",()=>{data.submitted=true;render();document.getElementById("result").focus()},"primary"));
  else footer.append(action("Neuer Versuch",()=>{
    data.submitted=false;
    data.parts.forEach(p=>p.values.fill(""));
    render(true);
  }));
  work.append(footer);
  if(focus)heading.focus();
}
function go(i){current=i;render(true);window.scrollTo(0,0)}
cases.forEach((entry,i)=>nav.append(action(i===cases.length-1?"Selbstcheck":`${i+1}. ${entry.title}`,()=>go(i))));
render();
</script></html>
